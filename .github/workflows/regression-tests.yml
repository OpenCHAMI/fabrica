name: Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'testing/**'
      - 'feat/**'


jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.5']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Build fabrica
      run: make build

    - name: Verify executable storage annotation example
      run: bash examples/12-storage-annotations/verify-example.sh

    - name: Run Go integration tests
      run: |
        cd test/integration
        go mod tidy
        go test -v -timeout 10m

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts-go-${{ matrix.go-version }}
        path: |
          test/integration/testdata/
        retention-days: 7

  generated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fabrica_admin_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FABRICA_TEST_POSTGRES_DSN: postgres://fabrica_app:fabrica_app_ci@127.0.0.1:5432/fabrica_acceptance?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Create restricted PostgreSQL application role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE ROLE fabrica_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'fabrica_app_ci';
          CREATE DATABASE fabrica_acceptance OWNER postgres;
          REVOKE ALL ON DATABASE fabrica_acceptance FROM PUBLIC;
          GRANT CONNECT, CREATE ON DATABASE fabrica_acceptance TO fabrica_app;
          SQL
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d fabrica_acceptance <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO fabrica_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO fabrica_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO fabrica_app;
          SQL

      - name: Run generated PostgreSQL contract
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          go test -tags=integration -count=1 -v ./pkg/codegen -run '^TestGeneratedPostgres' | tee "$output"
          grep -q -- '^--- PASS: TestGeneratedPostgres_connection_uses_restricted_role' "$output"
          grep -q -- '^--- PASS: TestGeneratedPostgres_acceptance' "$output"
