name: Tests

on:
  pull_request:
  push:
    branches:
      - main


jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Build fabrica
      run: make build

    - name: Run Go integration tests
      run: |
        cd test/integration
        go mod tidy
        go test -v -timeout 10m

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts
        path: |
          test/integration/testdata/
        retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test
